<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Marina's Aesthetic Space</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #fdf5f7; /* Тот самый нежно-розовый */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        #glow {
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,180,200,0.8), transparent);
            filter: blur(60px);
            transition: background 5s ease;
        }
        h1 {
            position: absolute;
            color: #d4a5a5;
            letter-spacing: 5px;
            font-weight: 200;
        }
    </style>
</head>
<body>

    <h1>MARINA XOXO</h1>
    <div id="glow"></div>

    <script>
        const glow = document.getElementById('glow');
        
        // Магия цвета: меняем оттенки плавно
        function changeColor() {
            const colors = [
                'rgba(255,180,200,0.8)', // Розовый
                'rgba(180,200,255,0.8)', // Голубой (как небо под тучкой)
                'rgba(255,220,180,0.8)'  // Теплый закатный
            ];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            glow.style.background = `radial-gradient(circle, ${randomColor}, transparent)`;
        }

        setInterval(changeColor, 4000);
    </script>
</body>
</html>
