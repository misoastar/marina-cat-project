<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
    <style>
        body { margin: 0; height: 100vh; overflow: hidden; background: #fdf5f7; }
        #cat { 
            position: absolute; font-size: 50px; transition: transform 0.1s; 
            cursor: pointer; user-select: none;
        }
    </style>
</head>
<body>

    <div id="cat">🐈</div>

    <script>
        const cat = document.getElementById('cat');
        let mouseX = 0, mouseY = 0;
        let catX = 0, catY = 0;
        const speed = 0.08; // Скорость бега

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animate() {
            // Расстояние до курсора
            let dx = mouseX - catX;
            let dy = mouseY - catY;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance > 60) {
                // Котик бежит
                catX += dx * speed;
                catY += dy * speed;
                cat.textContent = '🐈'; // Бегущий
            } else {
                // Котик добежал и ждет
                cat.textContent = '🐈‍⬛'; // Сидящий
            }

            cat.style.left = catX + 'px';
            cat.style.top = catY + 'px';
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
